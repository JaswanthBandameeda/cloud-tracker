<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Tracker</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --accent-blue: #007aff;
            --accent-orange: #ff9500;
            --accent-green: #34c759;
            --accent-purple: #af52de;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .hero {
            margin-bottom: 30px;
        }
        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }
        .hero h1.muted {
            color: var(--text-muted);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 40px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            margin: 10px 0 0 0;
            letter-spacing: -1px;
        }
        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
        }
        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-left: 5px;
        }
        .course-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .course-card {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .icon-blue { background: rgba(0,122,255,0.12); color: var(--accent-blue); }
        .icon-orange { background: rgba(255,149,0,0.12); color: var(--accent-orange); }
        .icon-green { background: rgba(52,199,89,0.12); color: var(--accent-green); }

        .course-info {
            flex-grow: 1;
        }
        .provider {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 0 0 4px 0;
            letter-spacing: 0.5px;
        }
        .course-title {
            font-size: 17px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }
        .progress-bar {
            height: 6px;
            background-color: #e5e5ea;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Your Learning.</h1>
            <h1 class="muted">Engineered for Cloud.</h1>
        </div>

        <div class="stats-grid">
            <div class="card">
                <div style="color: var(--accent-orange); font-size: 24px;">🔥</div>
                <p class="stat-value">14</p>
                <p class="stat-label">Days Streak</p>
            </div>
            <div class="card">
                <div style="color: var(--accent-purple); font-size: 24px;">⚙️</div>
                <p class="stat-value">28</p>
                <p class="stat-label">Labs Completed</p>
            </div>
        </div>

        <h2 class="section-title">Active Modules</h2>
        <div class="course-list">
            
            <div class="card course-card">
                <div class="icon-box icon-blue">AZ</div>
                <div class="course-info">
                    <p class="provider">Microsoft</p>
                    <p class="course-title">Azure Architecture</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 85%; background-color: var(--accent-blue);"></div>
                    </div>
                </div>
            </div>

            <div class="card course-card">
                <div class="icon-box icon-orange">AW</div>
                <div class="course-info">
                    <p class="provider">Amazon</p>
                    <p class="course-title">AWS Solutions</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 40%; background-color: var(--accent-orange);"></div>
                    </div>
                </div>
            </div>

            <div class="card course-card">
                <div class="icon-box icon-green">GC</div>
                <div class="course-info">
                    <p class="provider">Google</p>
                    <p class="course-title">GCP Data Engineering</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 10%; background-color: var(--accent-green);"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
